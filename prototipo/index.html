<title>Gestão Aline Antunes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap">
<style>
/* Layout: app de gestão; barra lateral no computador, abas embaixo no celular. Identidade do site da Aline: off-white, rosa em pílula, títulos em serifa com itálico rosa. */
:root{
  --bg:#FFFDFC; --surface:#FFFFFF; --rose-50:#FFF8FA; --rose-100:#FBE3EC; --cream:#FEF7D9;
  --ink:#222220; --muted:#796B70; --line:#F0E2E8;
  --accent:#B24A77; --on-accent:#FFFFFF; --deco:#DA6F9A; --deco-soft:#F7D7E4; --bar-s:#CDBCC3;
  --good:#2F7A57; --good-bg:#E6F4EC; --warn:#965905; --warn-bg:#FDF1DC; --bad:#B3261E; --bad-bg:#FBE9E7;
  --sig:#16A34A; --shadow:0 1px 2px rgba(90,30,55,.05),0 10px 30px rgba(90,30,55,.07); --scrim:rgba(34,20,28,.42);
  --dot1:#F9CFDE; --dot2:#FCEFB8; --dot3:#CFEAF2; --blob1:#FDE7EF; --blob2:#FFF6D6;
  --f-display:'Playfair Display',Georgia,'Times New Roman',serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
:root.escuro{
  --bg:#191517; --surface:#221D20; --rose-50:#261F23; --rose-100:#3A2A31; --cream:#30291A;
  --ink:#F6EEF1; --muted:#BFAEB5; --line:#3A3035;
  --accent:#DA6F9A; --on-accent:#1E1A1C; --deco:#DA6F9A; --deco-soft:#4A2E3A; --bar-s:#6E5C64;
  --good:#7FD3A5; --good-bg:#1D3128; --warn:#F0BE6A; --warn-bg:#3A2E17; --bad:#F4978E; --bad-bg:#3D2220;
  --sig:#22C55E; --shadow:none; --scrim:rgba(0,0,0,.6); --dot1:#4A2C39; --dot2:#3D3622; --dot3:#22363D; --blob1:#2A1F24; --blob2:#28241A; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
.confete{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.confete i{position:absolute;border-radius:50%;display:block}
.app{position:relative;z-index:1}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--deco);outline-offset:2px;border-radius:6px}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:600 30px/1.15 var(--f-display);letter-spacing:-.01em}
h1 em,h2 em{color:var(--deco);font-style:italic;font-weight:500}
h2{font:600 22px/1.2 var(--f-display)}
h3{font:600 15px/1.3 var(--f-body)}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}

.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:transparent;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.logo{height:40px;width:auto}
.proto{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:4px 10px;border-radius:999px;white-space:nowrap}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding-block:24px 128px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px;min-width:0}
.credit{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.main .credit{justify-content:center;padding-bottom:16px}

@media (min-width:900px){
  .app{grid-template-columns:248px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);background:transparent}
  .side .logo{height:52px;margin:4px 8px 0}
  .top,.tabbar{display:none!important}
  .wrap{padding-block:32px 48px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
  .main .credit{display:none}
  h1{font-size:36px}
}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--rose-100)}
.nav a[aria-current="page"]{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:var(--shadow)}
.side .spacer{flex:1}
.side .btn{width:100%}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;font-size:14px;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer}
.tabbar a[aria-current="page"]{color:var(--accent);font-weight:600}
.tabbar .fab span.circ{width:44px;height:44px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 18px rgba(178,74,119,.35);margin-top:-18px}
.tabbar .fab{color:var(--accent);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid transparent;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-p{background:var(--accent);color:var(--on-accent)}
.btn-p:hover{filter:brightness(1.06)}
.btn-s{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-s:hover{border-color:var(--deco)}
.btn-g{background:none;color:var(--accent);padding:0 12px}
.btn-d{background:var(--bad);color:var(--surface)}
.btn-sm{min-height:36px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.head > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:760px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:1000px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .lbl{font-size:14px;color:var(--muted);font-weight:500}
.stat .val{font:600 clamp(18px,5vw,24px)/1.15 var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.stat .sub{font-size:14px;color:var(--muted)}
.stat.hero{background:var(--rose-50);border-color:var(--deco-soft)}
@media (min-width:600px){.stat .val{font-size:28px}}
.meter{height:8px;border-radius:999px;background:var(--rose-100);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--deco)}
.meter.warn i{background:var(--warn)}
.meter.bad i{background:var(--bad)}
.meter.good i{background:var(--good)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap;line-height:1.5}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.deco{background:var(--rose-100);color:var(--accent)}
.pill.line{border:1px solid var(--line);color:var(--muted)}

.alert{display:flex;gap:12px;align-items:flex-start;background:var(--cream);border-radius:16px;padding:16px 20px}
.alert .ic{color:var(--warn);margin-top:2px}
.alert b{font-weight:600}
.alert a{color:var(--accent);font-weight:600}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.click{cursor:pointer;border-radius:12px;padding-inline:8px;margin-inline:-8px}
.row.click:hover{background:var(--rose-50)}
.v.e{color:var(--good)}
@media (max-width:599px){
  .row{flex-wrap:wrap;row-gap:8px}
  .row .grow{flex:1 1 calc(100% - 48px)}
  .row > .btn,.row > .pill{margin-left:48px}
  .row > .v{margin-left:auto}
}
.dot{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:700}
.dot.e{background:var(--good-bg);color:var(--good)}
.dot.s{background:var(--rose-100);color:var(--accent)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:32px 16px;color:var(--muted)}
.empty b{color:var(--ink);font-weight:600}

.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.monthnav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.monthnav b{min-width:150px;text-align:center;font-weight:600;text-transform:capitalize}
.iconbtn{width:44px;height:40px;display:grid;place-items:center;border:0;background:none;border-radius:999px;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:var(--rose-50)}
.iconbtn[disabled]{opacity:.3;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.search{display:flex;align-items:center;gap:8px;flex:1;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:44px;color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--ink)}
.sumline{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:14px;color:var(--muted)}
.sumline b{color:var(--ink);font-variant-numeric:tabular-nums}

.evgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:760px){.evgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ev{display:flex;gap:16px;align-items:flex-start;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.ev:hover{border-color:var(--deco)}
.date{flex:none;width:56px;border-radius:12px;background:var(--rose-50);text-align:center;padding:8px 0;display:flex;flex-direction:column}
.date b{font:600 22px/1 var(--f-display);color:var(--accent)}
.date span{font-size:14px;color:var(--muted);text-transform:lowercase}
.ev .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.ev .t{font-weight:600;font-size:16px}
.prog{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:0 14px;min-height:44px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;font-weight:600;min-height:44px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.kv{grid-template-columns:repeat(4,minmax(0,1fr))}}

.dre{display:flex;flex-direction:column}
.dre .l{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-variant-numeric:tabular-nums}
.dre .l.ind{padding-left:16px;color:var(--muted)}
.dre .l.tot{border-top:1px solid var(--line);font-weight:600;padding-top:12px}
.dre .l.big{font:600 20px/1.3 var(--f-body);border-top:2px solid var(--ink);padding-top:12px;margin-top:4px}
.dre .sec{font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:16px}

.chartbox{overflow-x:auto;min-width:0}
.chartbox svg{display:block;min-width:640px;width:100%;height:auto}
.c-grid{stroke:var(--line);stroke-width:1}
.c-zero{stroke:var(--muted);stroke-width:1}
.c-txt{fill:var(--muted);font:500 12px var(--f-body)}
.c-e{fill:var(--deco)}
.c-s{fill:var(--bar-s)}
.c-fut{opacity:.45}
.c-line{fill:none;stroke:var(--ink);stroke-width:2}
.c-pt{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.c-pt.neg{stroke:var(--bad);fill:var(--bad)}
.c-today{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 4}
.c-lbl{fill:var(--accent);font:600 12px var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{border-top:0;color:var(--muted);font-weight:600}
.tbl td.neg{color:var(--bad);font-weight:600}
.tbl tr.fut td{color:var(--muted)}
.tblbox{overflow-x:auto}

.hbar{display:flex;flex-direction:column;gap:6px}
.hbar .track{height:12px;border-radius:999px;background:var(--rose-50);overflow:hidden;display:flex}
.hbar .track i{display:block;height:100%}
.hbar .top3{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Folha (lançar, detalhes) */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;
  padding:20px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{max-width:540px;border-radius:20px;padding:28px}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--rose-50);border-radius:999px;padding:4px;gap:4px}
.seg button{min-height:44px;border:0;border-radius:999px;background:none;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"].e{color:var(--good)}
.seg button[aria-pressed="true"].s{color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lab{font-size:14px;font-weight:600}
.field input,.field select{min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 14px;width:100%}
.field input:focus,.field select:focus{border-color:var(--deco);outline:none;box-shadow:0 0 0 3px var(--deco-soft)}
.field input[aria-invalid="true"]{border-color:var(--bad)}
.field .err{font-size:14px;color:var(--bad);font-weight:500}
.field .hint{font-size:14px;color:var(--muted)}
.money{font:600 28px/1 var(--f-body)!important;min-height:60px!important;font-variant-numeric:tabular-nums}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:0 4px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.actions .btn-p{flex:1}
.confirm{background:var(--bad-bg);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.formerr{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:12px 16px;font-weight:500;font-size:14px}
.preview{background:var(--rose-50);border-radius:12px;padding:12px 16px;font-size:14px;display:flex;flex-direction:column;gap:4px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (min-width:900px){.toast{bottom:32px}}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  .toast{animation:fade .2s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}}
  @keyframes fade{from{opacity:0}}
}
.links{display:flex;flex-direction:column}
.links a{display:flex;align-items:center;gap:12px;min-height:56px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:500}
.links a:first-child{border-top:0}
.links a .ic:last-child{margin-left:auto;color:var(--muted)}
.swatch{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);display:inline-block}
</style>

<div class="confete" id="confete" aria-hidden="true"></div>

const saldoConta=id=>{const c=conta(id);return c.ini+sum(S.L.filter(l=>l.conta===id&&l.pago&&l.pago>='2026-10-01'),sinal)};
const saldoTotal=()=>sum(S.contas,c=>saldoConta(c.id));
const fixosMes=()=>sum(S.rec);
function resumoMes(ym){
  const p=S.L.filter(l=>l.pago&&l.pago.slice(0,7)===ym);
  const ent=sum(p.filter(l=>l.tipo==='e'));
  const custos=sum(p.filter(l=>l.tipo==='s'&&cat(l.cat).nat!=='retirada'));
  const ret=sum(p.filter(l=>cat(l.cat).nat==='retirada'));
  return {p,ent,custos,ret,lucro:ent-custos};
}
const folego=()=>saldoTotal()/(fixosMes()+S.cfg.retiradaMin);
const reserva=()=>S.cfg.reservaMeses*fixosMes();
function podeRetirar(){const m=resumoMes(MES);return Math.max(0,Math.min(m.lucro-m.ret,saldoTotal()-reserva()))}
function projecao(){
  const out=[];let saldo=SALDO_MAIO;
  HIST.forEach(h=>{saldo+=h.e-h.s;out.push({ym:h.ym,e:h.e,s:h.s,saldo,fut:false})});
  for(let k=0;k<7;k++){
    const ym=addMes(MES,k);
    if(k===0){const p=S.L.filter(l=>l.pago&&l.pago.slice(0,7)===ym),f=S.L.filter(l=>!l.pago&&l.venc.slice(0,7)===ym);
      const e=sum(p.filter(l=>l.tipo==='e'))+sum(f.filter(l=>l.tipo==='e')),s=sum(p.filter(l=>l.tipo==='s'))+sum(f.filter(l=>l.tipo==='s'));
      saldo+=e-s;out.push({ym,e,s,saldo,fut:false});continue}
    const f=S.L.filter(l=>!l.pago&&l.venc.slice(0,7)===ym);
    const e=sum(f.filter(l=>l.tipo==='e')),s=sum(f.filter(l=>l.tipo==='s'))+S.cfg.retiradaMin;
    saldo+=e-s;out.push({ym,e,s,saldo,fut:true});
  }
  return out;
}
const primeiroNegativo=()=>projecao().find(m=>m.fut&&m.saldo<0);
function evFin(ev){
  const ls=S.L.filter(l=>l.ev===ev.id);
  const ent=ls.filter(l=>l.tipo==='e'),sai=ls.filter(l=>l.tipo==='s');
  const recebido=sum(ent.filter(l=>l.pago)),aReceber=sum(ent.filter(l=>!l.pago)),custos=sum(sai);
  const reserv=ev.fonte==='workshop'?S.insc.filter(i=>i.ev===ev.id&&i.status==='reservada').length*ev.insc:0;
  const total=ev.fonte==='workshop'?recebido+aReceber+reserv:ev.valor;
  const lucro=total-custos;
  return {ent,sai,recebido,aReceber:aReceber+reserv,custos,total,lucro,margem:total?lucro/total:0};
}

function vFluxo(){
  const P=projecao(),neg=P.find(m=>m.fut&&m.saldo<0);
  const W=760,H=300,L=64,R=16,T=20,B=36,pw=W-L-R,ph=H-T-B;
  const hi=Math.max(...P.map(m=>Math.max(m.e,m.s,m.saldo))),lo=Math.min(0,...P.map(m=>m.saldo));
  const rawStep=(hi-lo)/4,mag=Math.pow(10,Math.floor(Math.log10(rawStep))),step=[1,2,2.5,5,10].map(k=>k*mag).find(k=>k>=rawStep);
  const yMin=Math.floor(lo/step)*step,yMax=Math.ceil(hi/step)*step;
  const y=v=>T+ph-(v-yMin)/(yMax-yMin)*ph;
  const gw=pw/P.length,bw=Math.min(16,gw*.28);
  let g='';
  for(let v=yMin;v<=yMax+1e-6;v+=step){g+=`<line class="${v===0?'c-zero':'c-grid'}" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="c-txt" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v===0?'R$ 0':(v/1000).toLocaleString('pt-BR')+' mil'}</text>`}
  P.forEach((m,i)=>{const cx=L+gw*i+gw/2,fc=m.fut?' c-fut':'';
    g+=`<rect class="c-e${fc}" x="${cx-bw-1}" y="${y(m.e)}" width="${bw}" height="${Math.max(0,y(0)-y(m.e))}" rx="3"/>`;
    g+=`<rect class="c-s${fc}" x="${cx+1}" y="${y(m.s)}" width="${bw}" height="${Math.max(0,y(0)-y(m.s))}" rx="3"/>`;
    g+=`<text class="c-txt" x="${cx}" y="${H-12}" text-anchor="middle">${mesCurto(m.ym)}</text>`});
  const pts=P.map((m,i)=>[L+gw*i+gw/2,y(m.saldo)]);
  g+=`<polyline class="c-line" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
  pts.forEach((p,i)=>g+=`<circle class="c-pt${P[i].saldo<0?' neg':''}" cx="${p[0]}" cy="${p[1]}" r="4"/>`);
  const iHoje=P.findIndex(m=>m.ym===MES),xh=L+gw*(iHoje+1);
  g+=`<line class="c-today" x1="${xh}" x2="${xh}" y1="${T}" y2="${T+ph}"/><text class="c-lbl" x="${xh+6}" y="${T+10}">previsto</text>`;
  const rows=P.map(m=>`<tr class="${m.fut?'fut':''}"><td>${mesCurto(m.ym)}${m.fut?' (previsto)':''}</td><td>${brl0(m.e)}</td><td>${brl0(m.s)}</td><td class="${m.saldo<0?'neg':''}">${brl0(m.saldo)}</td></tr>`).join('');
  return `${neg?`<div class="alert">${ic('alert')}<p><b>Sem novos eventos, o caixa fica negativo em ${mesNome(neg.ym)}.</b> A previsão conta as parcelas a receber, os custos fixos e uma retirada de ${brl0(S.cfg.retiradaMin)} por mês. Cada evento novo empurra essa data para frente.</p></div>`:''}
  <section class="card"><div class="card-h"><h2>Fluxo de caixa</h2><div class="legend"><span><i style="background:var(--deco)"></i>Entradas</span><span><i style="background:var(--bar-s)"></i>Saídas</span><span><i style="background:var(--ink);height:3px"></i>Saldo no fim do mês</span></div></div>
   <div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas, saídas e saldo de maio de 2026 a abril de 2027">${g}</svg></div>
   <div class="tblbox"><table class="tbl"><thead><tr><th>Mês</th><th>Entradas</th><th>Saídas</th><th>Saldo</th></tr></thead><tbody>${rows}</tbody></table></div>
   <p class="muted">De maio a setembro, os números vêm do caderno da Aline (exemplo). De outubro em diante, vêm dos lançamentos.</p></section>`;
}
function vFontes(){

  S.eventos.filter(e=>e.status==='realizado').forEach(e=>{const f=evFin(e);F[e.fonte].r+=f.total;F[e.fonte].c+=f.custos});

  const evs=S.eventos.slice().sort((a,b)=>b.data.localeCompare(a.data));
  abrir(`${shHead('Lançar')}
   <div class="seg" role="group" aria-label="Tipo"><button type="button" class="e" data-act="dTipo" data-v="e" aria-pressed="${d.tipo==='e'}">Entrada</button><button type="button" class="s" data-act="dTipo" data-v="s" aria-pressed="${d.tipo==='s'}">Saída</button></div>
   <div class="field"><label for="d-valor">Valor</label><input id="d-valor" class="money" inputmode="decimal" placeholder="R$ 0,00" value="${esc(d.valor)}" autofocus autocomplete="off"><span class="err" id="d-valor-err" hidden></span></div>
   <div class="field"><span class="lab" id="d-cat-l">Categoria</span><div class="chips" role="group" aria-labelledby="d-cat-l">${cats.map(c=>`<button type="button" class="chip" data-act="dCat" data-v="${c.id}" aria-pressed="${d.cat===c.id}">${esc(c.nome)}</button>`).join('')}</div><span class="err" id="d-cat-err" hidden></span></div>
   <div class="field"><label for="d-ev">Evento (opcional)</label><select id="d-ev"><option value="">Sem evento</option>${evs.map(e=>`<option value="${e.id}" ${d.ev===e.id?'selected':''}>${esc(e.titulo)} · ${dm(e.data)}</option>`).join('')}</select></div>
   <div class="f2"><div class="field"><label for="d-data">Data</label><input id="d-data" type="date" value="${d.data}"><span class="err" id="d-data-err" hidden></span></div>
     <div class="field"><label for="d-conta">Conta</label><select id="d-conta">${S.contas.map(k=>`<option value="${k.id}" ${d.conta===k.id?'selected':''}>${esc(k.nome)}</option>`).join('')}</select></div></div>
   <div class="field"><label for="d-desc">Descrição (opcional)</label><input id="d-desc" value="${esc(d.desc)}" placeholder="Ex.: flores do painel" maxlength="80"></div>
   <label class="toggle"><span>${d.tipo==='e'?'Já recebi':'Já paguei'}</span><input id="d-pago" type="checkbox" ${d.pago?'checked':''}></label>
   <div class="formerr" id="d-geral" hidden></div>
   <div class="actions"><button class="btn btn-s" type="button" data-act="fechar">Cancelar</button><button class="btn btn-p" type="button" data-act="salvarL">${ic('check',18)}Salvar lançamento</button></div>`);
}
function syncDraft(){if(!draft)return;const g=id=>document.getElementById(id);
  draft.valor=g('d-valor').value;draft.ev=g('d-ev').value;draft.data=g('d-data').value;draft.conta=g('d-conta').value;draft.desc=g('d-desc').value;draft.pago=g('d-pago').checked}
function salvarL(){
  syncDraft();const d=draft,v=parseBRL(d.valor);let ok=true;
  err('d-valor',v>0?'':'Informe um valor maior que zero.');if(!(v>0))ok=false;
  err('d-cat',d.cat?'':'Escolha uma categoria.');if(!d.cat)ok=false;
  err('d-data',/^\d{4}-\d{2}-\d{2}$/.test(d.data)?'':'Informe a data.');if(!d.data)ok=false;
  const g=document.getElementById('d-geral');
  if(ok&&S.fechados[d.data.slice(0,7)]){g.textContent=`${mesNome(d.data.slice(0,7))} está fechado. Reabra o mês em Relatórios ou escolha outra data.`;g.hidden=false;ok=false}else g.hidden=true;
  if(!ok){const f=body.querySelector('[aria-invalid="true"]');f&&f.focus();return}
  lc(d.tipo,v,d.data,d.pago?d.data:null,d.conta,d.cat,d.ev||null,d.desc.trim());
  fechar();toast(d.tipo==='e'?'Entrada salva':'Saída salva');rerender();
}
function sheetVerL(l){
  const ev=l.ev?evento(l.ev):null,lk=S.fechados[mesDe(l)];
  abrir(`${shHead(esc(l.desc||cat(l.cat).nome))}
   <div class="dre"><div class="l"><span class="muted">Valor</span><b class="num">${l.tipo==='e'?'+':'−'} ${brl(l.valor)}</b></div>
    <div class="l"><span class="muted">Categoria</span><span>${esc(cat(l.cat).nome)}</span></div>
    ${ev?`<div class="l"><span class="muted">Evento</span><span>${esc(ev.titulo)}</span></div>`:''}
    <div class="l"><span class="muted">Conta</span><span>${esc(conta(l.conta).nome)}</span></div>
    <div class="l"><span class="muted">${l.pago?(l.tipo==='e'?'Recebido em':'Pago em'):'Vence em'}</span><span>${dmy(l.pago||l.venc)}</span></div>
    <div class="l"><span class="muted">Situação</span>${statusL(l)}</div>
    ${l.rec?`<div class="l"><span class="muted">Origem</span><span>Custo fixo mensal</span></div>`:''}</div>
   ${lk?`<p class="muted">${ic('lock',16)} ${mesNome(mesDe(l))} está fechado. Para alterar, reabra o mês em Relatórios.</p>`
   :S.ui.confirmDel===l.id?`<div class="confirm"><b>Excluir este lançamento?</b><span>${brl(l.valor)} · ${esc(cat(l.cat).nome)}. Ele some dos relatórios e do saldo.</span><div class="actions"><button class="btn btn-s" type="button" data-act="delCancel" data-id="${l.id}">Cancelar</button><button class="btn btn-d" type="button" data-act="delOk" data-id="${l.id}">Excluir lançamento</button></div></div>`
   :`<div class="actions"><button class="btn btn-g" type="button" data-act="del1" data-id="${l.id}">Excluir</button>${l.pago?'':`<button class="btn btn-p" type="button" data-act="pagar" data-id="${l.id}">${ic('check',18)}${l.tipo==='e'?'Marcar como recebido':'Marcar como pago'}</button>`}</div>`}`);
}
let evDraft=null;
function sheetNovoEv(){
  const d=evDraft,ws=d.fonte==='workshop';
  const v=ws?0:parseBRL(d.valor),sp=Math.min(100,Math.max(0,+d.sinal||0)),sv=Math.round(v*sp)/100,rv=Math.round((v-sv)*100)/100;
  abrir(`${shHead('Novo evento')}
   <div class="field"><label for="n-tit">Nome do evento</label><input id="n-tit" value="${esc(d.titulo)}" placeholder="Ex.: Aniversário de 5 anos · Laura" autofocus maxlength="80"><span class="err" id="n-tit-err" hidden></span></div>
   <div class="field"><span class="lab" id="n-f-l">Área</span><div class="chips" role="group" aria-labelledby="n-f-l">${Object.entries(FONTES).map(([k,t])=>`<button type="button" class="chip" data-act="nFonte" data-v="${k}" aria-pressed="${d.fonte===k}">${t}</button>`).join('')}</div></div>
   ${ws?'':`<div class="field"><label for="n-cli">Cliente</label><select id="n-cli"><option value="">Escolha a cliente</option>${S.clientes.map(c=>`<option value="${c.id}" ${d.cli===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select><span class="err" id="n-cli-err" hidden></span></div>`}
   <div class="f2"><div class="field"><label for="n-data">Data do evento</label><input id="n-data" type="date" value="${d.data}"><span class="err" id="n-data-err" hidden></span></div>
    ${ws?`<div class="field"><label for="n-vagas">Vagas</label><input id="n-vagas" type="number" min="1" value="${esc(d.vagas)}"></div>`
        :`<div class="field"><label for="n-valor">Valor fechado</label><input id="n-valor" inputmode="decimal" placeholder="R$ 0,00" value="${esc(d.valor)}"><span class="err" id="n-valor-err" hidden></span></div>`}</div>
   ${ws?`<div class="field"><label for="n-insc">Valor da inscrição</label><input id="n-insc" inputmode="decimal" placeholder="R$ 0,00" value="${esc(d.insc)}"><span class="err" id="n-insc-err" hidden></span></div>`
   :`<div class="f2"><div class="field"><label for="n-sinal">Entrada (%)</label><input id="n-sinal" type="number" min="0" max="100" value="${esc(d.sinal)}"></div>
     <div class="field"><label for="n-dsinal">Data da entrada</label><input id="n-dsinal" type="date" value="${d.dsinal}"></div></div>
    <div class="preview" id="n-prev"><b>Parcelas previstas</b><span class="num">Entrada ${brl(sv)} em ${d.dsinal?dm(d.dsinal):'—'}</span><span class="num">Saldo ${brl(rv)} até ${d.data?dm(addDias(d.data,-5)):'—'} (5 dias antes)</span><span class="muted">Depois de salvar, dá para mudar valores e datas de cada parcela.</span></div>`}
   <div class="actions"><button class="btn btn-s" type="button" data-act="fechar">Cancelar</button><button class="btn btn-p" type="button" data-act="salvarEv">${ic('check',18)}Salvar evento</button></div>`);
}
function syncEv(){const g=id=>document.getElementById(id),d=evDraft;if(!d)return;
  d.titulo=g('n-tit').value;d.data=g('n-data').value;
  if(g('n-cli'))d.cli=g('n-cli').value;if(g('n-valor'))d.valor=g('n-valor').value;if(g('n-sinal'))d.sinal=g('n-sinal').value;if(g('n-dsinal'))d.dsinal=g('n-dsinal').value;
  if(g('n-vagas'))d.vagas=g('n-vagas').value;if(g('n-insc'))d.insc=g('n-insc').value}
function salvarEv(){
  syncEv();const d=evDraft,ws=d.fonte==='workshop';let ok=true;
  const chk=(id,cond,msg)=>{err(id,cond?'':msg);if(!cond)ok=false};
  chk('n-tit',d.titulo.trim().length>=3,'Dê um nome ao evento.');
  chk('n-data',!!d.data,'Informe a data do evento.');
  if(ws){chk('n-insc',parseBRL(d.insc)>0,'Informe o valor da inscrição.')}
  else{chk('n-cli',!!d.cli,'Escolha a cliente.');chk('n-valor',parseBRL(d.valor)>0,'Informe o valor fechado.')}
  if(!ok){const f=body.querySelector('[aria-invalid="true"]');f&&f.focus();return}
  const id=nid('e');
  if(ws){S.eventos.push({id,titulo:d.titulo.trim(),cli:null,fonte:'workshop',data:d.data,valor:0,vagas:Math.max(1,+d.vagas||10),insc:parseBRL(d.insc),status:'confirmado'})}
  else{const v=parseBRL(d.valor),sv=Math.round(v*Math.min(100,Math.max(0,+d.sinal||0)))/100;
    S.eventos.push({id,titulo:d.titulo.trim(),cli:d.cli,fonte:d.fonte,data:d.data,valor:v,status:'confirmado'});
    if(sv>0)lc('e',sv,d.dsinal||HOJE,null,'nubank',d.fonte,id,'Entrada ('+(+d.sinal)+'%)');
    if(v-sv>0)lc('e',Math.round((v-sv)*100)/100,addDias(d.data,-5),null,'nubank',d.fonte,id,'Saldo')}
  fechar();toast('Evento salvo');location.hash='evento-'+id;
}
function sheetNovoCli(){
  abrir(`${shHead('Novo cliente')}
   <div class="field"><label for="k-nome">Nome</label><input id="k-nome" autofocus maxlength="80" autocomplete="off"><span class="err" id="k-nome-err" hidden></span></div>
   <div class="f2"><div class="field"><label for="k-tel">Telefone</label><input id="k-tel" inputmode="tel" placeholder="(11) 99999-9999"><span class="err" id="k-tel-err" hidden></span></div>
    <div class="field"><label for="k-email">E-mail</label><input id="k-email" type="email" inputmode="email"><span class="err" id="k-email-err" hidden></span></div></div>
   <div class="field"><label for="k-doc">CPF ou CNPJ</label><input id="k-doc" inputmode="numeric"><span class="hint">Só se for necessário para contrato ou nota fiscal.</span><span class="err" id="k-doc-err" hidden></span></div>
   <div class="actions"><button class="btn btn-s" type="button" data-act="fechar">Cancelar</button><button class="btn btn-p" type="button" data-act="salvarCli">${ic('check',18)}Salvar cliente</button></div>`);
}
function cpfOk(c){if(c.length!==11||/^(\d)\1+$/.test(c))return false;const dv=n=>{let s=0;for(let i=0;i<n;i++)s+=+c[i]*(n+1-i);const r=s*10%11;return r===10?0:r};return dv(9)===+c[9]&&dv(10)===+c[10]}
function salvarCli(){
  const g=id=>document.getElementById(id).value.trim();let ok=true;
  const chk=(id,cond,msg)=>{err(id,cond?'':msg);if(!cond)ok=false};
  const tel=soDig(g('k-tel')),doc=soDig(g('k-doc')),em=g('k-email');
  chk('k-nome',g('k-nome').length>=3,'Informe o nome completo.');
  chk('k-tel',tel.length===10||tel.length===11,'Informe o telefone com DDD.');
  chk('k-email',!em||/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em),'Confira o e-mail.');
  chk('k-doc',!doc||cpfOk(doc)||doc.length===14,'Confira o CPF (11 números) ou o CNPJ (14 números).');
  if(!ok){const f=body.querySelector('[aria-invalid="true"]');f&&f.focus();return}
  const t=tel.length===11?`(${tel.slice(0,2)}) ${tel.slice(2,7)}-${tel.slice(7)}`:`(${tel.slice(0,2)}) ${tel.slice(2,6)}-${tel.slice(6)}`;
  S.clientes.push({id:nid('c'),nome:g('k-nome'),tel:t,email:em,doc});fechar();toast('Cliente salvo');rerender();
}

/* ---------- ações ---------- */
let tt;function toast(m){const t=document.getElementById('toast');t.innerHTML=ic('check',18)+esc(m);t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
const A={
 lancar:ds=>{draft={tipo:ds.tipo||'s',valor:'',cat:null,ev:ds.ev||'',conta:'nubank',data:HOJE,pago:true,desc:''};sheetLancar()},
 dTipo:ds=>{syncDraft();if(draft.tipo!==ds.v){draft.tipo=ds.v;draft.cat=null}sheetLancar()},
 dCat:ds=>{syncDraft();draft.cat=ds.v;sheetLancar();const b=body.querySelector(`[data-act="dCat"][data-v="${ds.v}"]`);b&&b.focus()},
 salvarL:()=>salvarL(),
 fechar:()=>fechar(),
 verL:ds=>{S.ui.confirmDel=null;sheetVerL(S.L.find(l=>l.id===ds.id))},
 pagar:ds=>{const l=S.L.find(x=>x.id===ds.id);if(S.fechados[l.venc.slice(0,7)]&&l.venc.slice(0,7)!==HOJE.slice(0,7)){toast('Mês fechado');return}
   l.pago=HOJE;if(!sheet.hidden)fechar();toast(l.tipo==='e'?'Recebimento confirmado':'Pagamento confirmado');rerender()},
 del1:ds=>{S.ui.confirmDel=ds.id;sheetVerL(S.L.find(l=>l.id===ds.id));body.querySelector('.btn-d').focus()},
 delCancel:ds=>{S.ui.confirmDel=null;sheetVerL(S.L.find(l=>l.id===ds.id))},
 delOk:ds=>{const l=S.L.find(x=>x.id===ds.id);S.L=S.L.filter(x=>x.id!==ds.id);if(l.insc){const i=S.insc.find(x=>x.id===l.insc);if(i){i.status='reservada';i.lanc=null}}
   S.ui.confirmDel=null;fechar();toast('Lançamento excluído');rerender()},
 filtro:ds=>{S.ui.tipo=ds.v;rerender()},
 mes:ds=>{S.ui.mes=addMes(S.ui.mes,+ds.v);rerender()},
 csv:()=>toast('No sistema, isso baixa a planilha do mês'),
 evTab:ds=>{S.ui.evTab=ds.v;rerender()},
 relTab:ds=>{S.ui.relTab=ds.v;rerender()},
 tab:ds=>{S.ui.relTab=ds.tab},
 fechar1:()=>{S.ui.confirmFech=true;rerender();document.querySelector('[data-act="fechOk"]').focus()},
 fechCancel:()=>{S.ui.confirmFech=false;rerender()},
 fechOk:()=>{S.fechados[MES]={em:HOJE};S.ui.confirmFech=false;toast('Outubro fechado');rerender()},
 reabrir:()=>{delete S.fechados[MES];toast('Outubro reaberto (registrado no histórico)');rerender()},
 novoEv:()=>{evDraft={titulo:'',fonte:'decoracao',cli:'',data:'',valor:'',sinal:'30',dsinal:HOJE,vagas:'12',insc:''};sheetNovoEv()},
 nFonte:ds=>{syncEv();evDraft.fonte=ds.v;sheetNovoEv()},
 salvarEv:()=>salvarEv(),
 novoCli:()=>sheetNovoCli(),
 salvarCli:()=>salvarCli(),
 inscPaga:ds=>{const i=S.insc.find(x=>x.id===ds.id),e=evento(i.ev);lc('e',e.insc,HOJE,HOJE,'nubank','workshop',e.id,'Inscrição · '+i.nome,{insc:i.id});i.status='paga';i.lanc=S.L[S.L.length-1].id;toast('Inscrição paga e lançada');rerender()},
 salvarCfg:()=>{const r=+document.getElementById('c-res').value,m=parseBRL(document.getElementById('c-ret').value);if(!(r>=0&&r<=24)){toast('A reserva vai de 0 a 24 meses');return}
   S.cfg.reservaMeses=r;S.cfg.retiradaMin=m;toast('Metas salvas');rerender()},
 convidar:()=>toast('No sistema, isso envia um convite por e-mail'),
 tema:ds=>{try{localStorage.setItem('tema',ds.v)}catch(e){}aplicarTema();if(ds.v==='escuro')document.documentElement.classList.add('escuro');else document.documentElement.classList.remove('escuro');rerender()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){if(t.tagName!=='A')e.preventDefault();f(t.dataset,t)}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!sheet.hidden)fechar();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.row.click')){e.preventDefault();e.target.click()}
  if(e.key==='Enter'&&!sheet.hidden&&e.target.matches('input:not([type=checkbox])')){const s=body.querySelector('[data-act^="salvar"]');if(s){e.preventDefault();s.click()}}
});
document.addEventListener('input',e=>{
  if(e.target.id==='busca'){S.ui.busca=e.target.value;const pos=e.target.selectionStart;rerender();const b=document.getElementById('busca');b.focus();b.setSelectionRange(pos,pos)}
  if(evDraft&&['n-valor','n-sinal','n-dsinal','n-data'].includes(e.target.id)&&document.getElementById('n-prev')){
    syncEv();const v=parseBRL(evDraft.valor),sv=Math.round(v*Math.min(100,Math.max(0,+evDraft.sinal||0)))/100;
    document.getElementById('n-prev').innerHTML=`<b>Parcelas previstas</b><span class="num">Entrada ${brl(sv)} em ${evDraft.dsinal?dm(evDraft.dsinal):'—'}</span><span class="num">Saldo ${brl(Math.round((v-sv)*100)/100)} até ${evDraft.data?dm(addDias(evDraft.data,-5)):'—'} (5 dias antes)</span><span class="muted">Depois de salvar, dá para mudar valores e datas de cada parcela.</span>`}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='f-insc')return;e.preventDefault();
  const n=document.getElementById('i-nome').value.trim(),tel=soDig(document.getElementById('i-tel').value);let ok=true;
  err('i-nome',n.length>=3?'':'Informe o nome da aluna.');if(n.length<3)ok=false;
  err('i-tel',tel.length===10||tel.length===11?'':'Informe o telefone com DDD.');if(!(tel.length===10||tel.length===11))ok=false;
  if(!ok)return;
  const ev=(location.hash.slice(1)).slice(7);
  S.insc.push({id:nid('i'),ev,nome:n,tel:`(${tel.slice(0,2)}) ${tel.slice(2,tel.length-4)}-${tel.slice(-4)}`,status:'reservada',lanc:null});
  toast('Inscrita adicionada');rerender();
});
/* confetes do site: posições fixas (sempre iguais), em rosa, amarelo e azul */
(function(){const c=document.getElementById('confete');let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  let h='<i style="width:320px;height:320px;left:-160px;top:22%;background:var(--blob1)"></i><i style="width:180px;height:180px;right:6%;top:12%;background:var(--blob2)"></i>';
  for(let k=0;k<34;k++){const sz=8+Math.round(rnd()*10),col=['--dot1','--dot2','--dot3'][k%3],top=k<20?rnd()*14:14+rnd()*86;
    h+=`<i style="width:${sz}px;height:${sz}px;left:${(rnd()*100).toFixed(1)}%;top:${top.toFixed(1)}%;background:var(${col})"></i>`}
  c.innerHTML=h})();
function aplicarTema(){let t='claro';try{t=localStorage.getItem('tema')||'claro'}catch(e){}document.documentElement.classList.toggle('escuro',t==='escuro');return t}
aplicarTema();
route();
</script>
