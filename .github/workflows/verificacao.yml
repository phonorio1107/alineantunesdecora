name: Verificação

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  app:
    name: Tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Cabeçalhos de segurança gerados
        run: grep -q "frame-ancestors 'none'" dist/_headers && grep -q "Strict-Transport-Security" dist/_headers
      - run: npm audit --omit=dev --audit-level=critical

  banco:
    name: Migrações e teste de isolamento
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Simular o ambiente do Supabase
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/supabase_local_stub.sql
      - name: Aplicar migrações (pelo mesmo script usado nos clientes)
        run: DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres bash scripts/cliente/migrar.sh
      - name: Teste de isolamento
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/isolamento.sql
